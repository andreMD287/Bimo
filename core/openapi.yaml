                properties:
                  entry_id:
                    type: "string"
                    pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
                    description: "ULID (26 caracteres Crockford base32)"
                required:
                  - "entry_id"
        "400":
          description: "Error: invalid_request"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Error: unauthenticated"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Error: forbidden, device_revoked, role_not_allowed"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Error: not_found"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      description: "Solo existe con BIMO_SIMULATORS=on; con off responde 404."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                sale_entry_ids:
                  minItems: 1
                  type: "array"
                  items:
                    type: "string"
                    pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
                    description: "ULID (26 caracteres Crockford base32)"
                fee_bps:
                  type: "integer"
                  minimum: 0
                  maximum: 10000
              required:
                - "sale_entry_ids"
                - "fee_bps"
      security:
        - supabaseJwt: []
components:
  schemas:
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
            - "details"
          properties:
            code:
              type: "string"
            message:
              type: "string"
            details:
              type: "object"
              additionalProperties: true
  securitySchemes:
    supabaseJwt:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "JWT de Supabase Auth (spec 06 §2)"
    linkToken:
      type: "http"
      scheme: "bearer"
      description: "Token del enlace de verificacion (spec 05)"
